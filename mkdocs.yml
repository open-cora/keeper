site_name: Keeper
site_description: The system of record for the experiment.
repo_url: https://github.com/open-cora/keeper
repo_name: open-cora/keeper
edit_uri: ""

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/theme.css

extra_javascript:
  - javascripts/hero-fade.js

extra:
  hero:
    masthead: Keeper
    tagline: Everything is written down, and not everyone may write.
    image: assets/hero-keeper-3600.webp
    srcset: "assets/hero-keeper-1200.webp 1200w, assets/hero-keeper-2400.webp 2400w, assets/hero-keeper-3600.webp 3600w"
    image_alt: >-
      The Sampling Officials, by Rembrandt, 1662: six guild officials behind a table under a red carpet, an open ledger in front of them, all looking up at the viewer.
    credit: Rembrandt van Rijn · The Sampling Officials · Rijksmuseum
    credit_url: https://www.rijksmuseum.nl/en/collection/SK-C-6

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Bounded contexts:
      - Access: bounded-contexts/access.md
      - Execution: bounded-contexts/execution.md
      - Custody: bounded-contexts/custody.md
      - Counsel: bounded-contexts/counsel.md
      - Equipment: bounded-contexts/equipment.md
      - Pursuit: bounded-contexts/pursuit.md
  - Reference:
      - Overview: reference/index.md
      - Workflow: reference/workflow.md
      - Layout: reference/layout.md
      - Modeling: reference/modeling.md
      - Patterns: reference/patterns.md
      - Conventions: reference/conventions.md
      - Naming: reference/naming.md
      - Runtime: reference/runtime.md
      - Client contract: reference/client-contract.md
      - Glossary: reference/glossary.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
