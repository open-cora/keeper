repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # Syntax-only parse so mkdocs.yml's !!python/name tags do not fail
        # the safe loader. Does not execute constructors.
        args: [--unsafe]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # Order matters: check (with --fix) before format.
      #
      # The pattern names every linted directory, and it is load-bearing
      # rather than tidy: a `files:` pattern that matches nothing is
      # indistinguishable from a clean tree, so it reports success on every
      # commit. The root copy of this hook once spelled a directory that had
      # been renamed and matched none of this project's 538 lintable files.
      # Renaming a directory means editing this line in the same commit.
      - id: ruff-check
        args: [--fix]
        files: ^(src|tests)/
      - id: ruff-format
        files: ^(src|tests)/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Local hooks so each tool runs against this project's uv venv and sees the
  # same dependencies and source tree pytest does.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: bash -c 'uv run pyright src tests'
        language: system
        pass_filenames: false
        files: ^(src|tests)/.+\.py$

      # Tach: declarative dependency contract. Config at tach.toml.
      - id: tach-check
        name: tach check
        entry: bash -c 'uv run tach check'
        language: system
        pass_filenames: false
        files: ^(src/keeper/.+\.py|tach\.toml)$

      # Architecture fitness functions: AST and filesystem checks tach
      # cannot express (slice file contract, decider purity, wire
      # completeness). Fast, run on every Python change.
      - id: arch-tests
        name: architecture fitness functions
        entry: bash -c 'uv run pytest tests/architecture -q'
        language: system
        pass_filenames: false
        files: ^(src/keeper/.+\.py|tests/architecture/.+\.py)$

      # ----------------------------------------------------------------
      # Pre-push only: full-tree ruff check + format, matching CI exactly.
      #
      # The ruff hooks above run against STAGED files only, so unstaged drift
      # can slip past pre-commit and trip CI on push. These run against the
      # whole tree at push time so the same violations CI would catch are
      # caught one round-trip earlier.
      #
      # Install with: pre-commit install --hook-type pre-push
      # (one-shot per clone; idempotent if already installed).
      # ----------------------------------------------------------------
      - id: ruff-check-all
        name: ruff check (full tree, matches CI)
        entry: bash -c 'uv run ruff check src tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
      - id: ruff-format-check-all
        name: ruff format --check (full tree, matches CI)
        entry: bash -c 'uv run ruff format --check src tests'
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
