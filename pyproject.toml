[project]
name = "keeper"
version = "0.1.0"
description = "Automated Rarely, Overpromised Continuously: a parallel domain-modeling effort on an event-sourced chassis"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Doga Gursoy" }]
license = { text = "Apache-2.0" }

dependencies = [
    "fastapi>=0.141.1,<0.142",
    "asyncpg>=0.31.0,<0.32",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "mcp>=1.28.1,<2",
    "uvicorn[standard]>=0.52.1",
    "structlog>=26.1.0",
    "uuid-utils>=0.17.0",
    # Already present transitively via uvicorn[standard]; pinned directly
    # because the status-push path imports it, not uvicorn's own use.
    "websockets>=16.0,<17",
    "prometheus-client>=0.26.0,<1",
    # 8.x is the first release that handles FastAPI 0.138's lazy
    # include_router routing (the `_IncludedRouter` BaseRoute carries no
    # `.path`); 7.x raises AttributeError per-request under 0.138.
    "prometheus-fastapi-instrumentator>=8.0.1,<9",
    # OpenTelemetry: api/sdk are 1.x stable; instrumentations and semconv
    # ship as 0.x companions on the same release cadence. Pin api/sdk to
    # <2 (next major would be breaking); pin instrumentations to <0.63
    # (next minor may be breaking on 0.x). Bump them in lockstep.
    "opentelemetry-api>=1.41,<2",
    "opentelemetry-sdk>=1.41,<2",
    "opentelemetry-semantic-conventions>=0.62b1,<0.63",
    "opentelemetry-instrumentation-fastapi>=0.62b1,<0.63",
    "opentelemetry-instrumentation-asyncpg>=0.62b1,<0.63",
    "opentelemetry-exporter-otlp-proto-http>=1.41,<2",
    "jsonschema-rs>=0.49.6,<1",
    # cryptography: explicit top-level floor pin rather than inheriting
    # whatever pyjwt[crypto] resolves to, so a bump is a reviewable diff.
    "cryptography>=50.0.0,<51",
    # PyJWT: the one library dependency for the edge-auth JWT path, used by
    # `JwtTokenVerifier` for bearer signature verification and JWKS rotation.
    # The `[crypto]` extra pulls in `cryptography` for RS256 and ES256, which
    # every real-world IdP uses. Everything else on the auth path
    # (introspection adapter, registry, middleware) is hand-written.
    "pyjwt[crypto]>=2.13.0,<3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pytest-cov>=7.1.0,<8",
    "coverage[toml]>=7.15.3,<8",
    "diff-cover>=10.4.1,<11",
    "ruff>=0.16.1,<0.17",
    "pyright>=1.1.411,<2",
    "httpx>=0.28.0",
    # httpx2: starlette 1.x routes its TestClient through httpx2 (it does
    # `import httpx2 as httpx` under TYPE_CHECKING), so without it pyright
    # resolves every client.post/.json/.status_code to Unknown and the
    # strict-typing gate fails across the contract suite. Runtime also warns
    # and prefers httpx2 when present.
    "httpx2>=2.9.1,<3",
    "asgi-lifespan>=2.1.0,<3",
    "pre-commit>=4.6.1,<5",
    "testcontainers[postgres]>=4.14.2,<5",
    "tach>=0.35.0",
    # pytest-xdist: the `worksteal` scheduler is the modern default for
    # mixed-duration suites (50ms unit alongside 200ms+ integration). One
    # Postgres container per worker via a session-scoped fixture sidesteps
    # testcontainers-python#567 contention.
    "pytest-xdist>=3.8.0,<4",
    # pytest-httpserver spins up an in-process Werkzeug HTTP server per test;
    # used to serve fake JWKS endpoints and IdP introspection endpoints.
    # A real server rather than a mocked transport because PyJWKClient does
    # its own HTTP fetch, and the full path catches more (kid-miss refetch,
    # connection handling) than mocking the network.
    "pytest-httpserver>=1.1.0,<2",
    # Per-test timeout enforcement. Without this, a single hung test (an
    # asyncpg call waiting on a connection that is never returned, a
    # deadlocked container, an unawaited future) stalls the entire xdist
    # session indefinitely: workers report nothing and the controller waits
    # forever. The `thread` method dumps a traceback from the hung test
    # before killing it, so the output points at the responsible line.
    "pytest-timeout>=2.4.0,<3",
    # Hypothesis: property-based testing. A `ci` profile is registered in
    # tests/conftest.py and auto-activates on CI=true to derandomize the seed
    # and disable the local example database, sidestepping xdist seed
    # collisions across worker processes.
    "hypothesis>=6.165.2,<7",
    # hypothesis-jsonschema drives a Hypothesis strategy from a JSON Schema
    # document; used to fuzz MCP tools against their declared `inputSchema`.
    # In maintenance mode and Draft 04/06/07 only, so the fuzz harness strips
    # the `$schema` field before invoking `from_schema`.
    "hypothesis-jsonschema>=0.23,<1",
    # jsonschema: stdlib-style Draft 07 validator used by the MCP fuzz harness
    # to round-trip responses through each tool's declared `outputSchema`.
    # `jsonschema-rs` above stays the runtime validator; they are kept separate
    # because the fuzz harness wants Python error ergonomics rather than the
    # Rust binding's throughput.
    "jsonschema>=4.21,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keeper"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# Parked directories are work-in-progress slices deliberately shelved
# (suffix `.parked`); mirrors the same exclusion in [tool.pyright].
extend-exclude = ["**/*.parked"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "TC",   # flake8-type-checking
    "N",    # pep8-naming
    "ASYNC",
    # Documentation guardrails (see docs/reference/conventions.md#documentation).
    # Selective subset of pydocstyle. D401 (imperative mood) is heuristic and
    # conflicts with the "True iff X" predicate idiom. D1xx (require docstring
    # presence) is left to reviewer judgment.
    "D200",     # one-line docstring fits on one line
    "D201",     # no blank lines before docstring
    "D202",     # no blank lines after function docstring
    "D210",     # no whitespace surrounding docstring text
    "D211",     # no blank lines before class docstring
    "D212",     # multi-line summary on the first line (vs D213)
    "D300",     # triple double quotes
    "D403",     # first word capitalized
    "D404",     # first word not "This"
    "D415",     # first line ends with .  ?  or !
    # TODO hygiene: git log and the PR description carry context, not source.
    "TD002",    # require TODO author
    "TD003",    # require TODO issue link
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
# `tests` is a first-party namespace too; without this, ruff groups
# `from tests.contract._helpers import ...` with third-party libraries
# rather than with `from keeper.* import ...`.
known-first-party = ["keeper", "tests"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/*.parked"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--strict-markers"]
testpaths = ["tests"]
asyncio_mode = "auto"
# Hard upper bound per test. Most unit and architecture tests are under
# 100ms; integration tests with testcontainers stay well under 30s because
# the Postgres container is session-scoped (one per xdist worker), so the
# per-test cost is a transaction and a few queries. 60s is a generous safety
# net that still catches genuine hangs in minutes rather than tens of them.
#
# The `thread` method spawns a watchdog that dumps tracebacks of all threads
# in the worker process before raising. It survives asyncio event loops and
# does not rely on SIGALRM, which signal-based timeouts need and which
# interacts poorly with asyncpg and uvloop. Works per-worker under xdist.
timeout = 60
timeout_method = "thread"
markers = [
    "unit: pure tests with no I/O",
    "architecture: structural fitness functions (AST/filesystem/SQL-text checks); no I/O",
    "integration: tests requiring Postgres or other external services",
    "contract: REST/MCP schema verification tests",
    "e2e: full end-to-end tests",
]

# Coverage. Default trace core (NOT sys.monitoring): on Python 3.13
# coverage.py silently falls back to ctrace when branch coverage or mixed
# thread/greenlet concurrency is on, and both apply here. `parallel = true`
# is required for pytest-xdist: each worker writes a suffixed `.coverage.*`
# file that pytest-cov combines at session end.
[tool.coverage.run]
branch = true
parallel = true
source = ["src/keeper"]
# Coverage-comment CI actions run from the repo root while pytest runs from
# apps/api, so absolute paths in .coverage become unresolvable. Relative
# paths also make .coverage files portable across the dev/CI/container split.
relative_files = true
omit = [
    "*/tests/*",
    "*/conftest.py",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
# `exclude_also` preserves the default `pragma: no cover` plus these
# AST-shape-level exclusions. `exclude_lines` would replace the defaults.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
# Soft floor, ratchet up over time, and currently the only coverage floor
# there is. `make diff-coverage` runs diff-cover against origin/main at 90%
# on changed lines, but no CI lane invokes it, so it gates nothing a
# contributor has to clear. Wire it into ci.yml before calling it a gate.
fail_under = 80

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
